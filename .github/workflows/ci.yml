name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expensa_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: expensa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expensa_owner -d expensa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL_OWNER: postgresql+asyncpg://expensa_owner:ci-owner-password@localhost:5432/expensa
      DATABASE_URL_APP: postgresql+asyncpg://expensa_app:ci-app-password@localhost:5432/expensa
      POSTGRES_APP_PASSWORD: ci-app-password
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production
      REDIS_URL: redis://localhost:6379/0
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Run tests
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check & build
        run: npm run build
