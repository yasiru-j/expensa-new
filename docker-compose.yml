services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-expensa_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-changeme-owner-password}
      POSTGRES_DB: ${POSTGRES_DB:-expensa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-expensa_owner} -d ${POSTGRES_DB:-expensa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL_OWNER: postgresql+asyncpg://${POSTGRES_OWNER_USER:-expensa_owner}:${POSTGRES_OWNER_PASSWORD:-changeme-owner-password}@postgres:5432/${POSTGRES_DB:-expensa}
      DATABASE_URL_APP: postgresql+asyncpg://${POSTGRES_APP_USER:-expensa_app}:${POSTGRES_APP_PASSWORD:-changeme-app-password}@postgres:5432/${POSTGRES_DB:-expensa}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  frontend:
    build: ./frontend
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  miniodata:
