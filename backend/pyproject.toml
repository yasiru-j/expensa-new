[project]
name = "expensa-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "authlib>=1.3",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "redis>=5.2",
  "python-multipart>=0.0.12",
  "email-validator>=2.2",
  "python-dotenv>=1.0",
  "openai>=1.55,<2",
  "boto3>=1.35",
  "pypdf>=5.1",
  "pypdfium2>=4.30",
  "Pillow>=11.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7",
  "black>=24.10",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends(...)-as-default-argument is the documented,
# idiomatic pattern (it's evaluated once per request by FastAPI's DI system,
# not a mutable-default footgun), so it's excluded rather than noqa'd everywhere.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: app.db.session.engine is a
# process-wide singleton (matching production), and its asyncpg pool can't
# be reused across different event loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
